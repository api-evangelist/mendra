aid: mendra
name: Mendra
description: Mendra is an AI-native biopharma company focused on developing breakthrough medicines for
  rare and ultra-rare pediatric diseases. It partners with R&D-stage biotech companies to accelerate
  clinical development and commercialization, handling regulatory, clinical, and reimbursement strategy
  while prioritizing the needs of patients and families. Founded by a team with experience from BioMarin,
  Palantir, and other pharma and biotech companies, Mendra launched with an $82 million Series A round
  and is backed by 8VC and Wing Venture Capital. The company operates a corporate marketing website and
  publishes no public API, developer portal, SDK, or technical documentation.
